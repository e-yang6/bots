<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aorta Branch Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Metrics panel (always visible on desktop) -->
        <div id="metrics-panel">
            <div id="metrics-header">
                <h2 id="metrics-case">---</h2>
                <span id="metrics-count">0 branches</span>
            </div>
            <div id="branch-list"></div>
        </div>

        <!-- Live camera feed (becomes main view when active) -->
        <video id="video-feed" autoplay playsinline muted></video>

        <!-- 3D viewport (main view, or secondary when video is active) -->
        <div id="viewport"></div>
    </div>

    <div id="overlay">
        <!-- Top bar -->
        <div id="top-bar">
            <h1>Aorta Branch Viewer</h1>
            <span id="case-badge">Case: <span id="case-id">---</span></span>
            <span id="branch-badge"><span id="branch-count">0</span> branches</span>
        </div>

        <!-- Toggle bar -->
        <div id="toggle-bar">
            <button id="btn-distinct" class="toggle-btn active">Distinct</button>
            <button id="btn-confidence" class="toggle-btn">Confidence</button>
            <button id="btn-rejected" class="toggle-btn active">Rejected: On</button>
        </div>

        <!-- Branch info panel (shown on tap) -->
        <div id="info-panel">
            <h2><span class="dot"></span>Branch <span id="info-id">---</span></h2>
            <div class="info-grid">
                <span class="label">Status</span>
                <span class="value" id="info-status">---</span>
                <span class="label">Radius</span>
                <span class="value" id="info-radius">---</span>
                <span class="label">Rule score</span>
                <span class="value" id="info-confidence">---</span>
                <span class="label">Ostium</span>
                <span class="value" id="info-ostium">---</span>
                <span class="label">Direction</span>
                <span class="value" id="info-direction">---</span>
            </div>
            <div id="info-rules">
                <h3>Rule breakdown</h3>
                <div id="rule-veto"></div>
                <div id="rule-terms"></div>
                <div id="rule-flat-penalties"></div>
                <div id="rule-total"></div>
            </div>
        </div>

        <!-- Status -->
        <div id="status">Loading...</div>

        <!-- AR button injected here -->
        <div id="ar-button-container"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/build/three.module.js",
            "three/addons/": "/vendor/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
